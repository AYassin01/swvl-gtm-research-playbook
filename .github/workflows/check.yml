name: Check guide and evidence tooling
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit.py repo
      - run: python -m unittest discover -s tests -v
      - name: Check runs declared complete
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          for path in sorted(Path('results').glob('*/session.json')):
              if json.loads(path.read_text()).get('declared_complete') is True:
                  subprocess.run([sys.executable, 'scripts/audit.py', 'ready', str(path.parent)], check=True)
          PY
