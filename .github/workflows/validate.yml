name: Validate text and research structure
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_repo.py
      - run: python scripts/evaluate.py data/baseline.json
      - run: python -m unittest discover -s evals -v
      - name: Check committed research runs
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          for path in sorted(Path('runs').glob('*/run.json')):
              subprocess.run(['python', 'scripts/evaluate.py', str(path)], check=True)
          PY
